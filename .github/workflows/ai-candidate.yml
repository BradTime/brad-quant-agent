name: AI candidate evaluation

on:
  workflow_dispatch:
    inputs:
      input_cost_per_million:
        description: DeepSeek input-token price per million
        required: true
        type: string
      output_cost_per_million:
        description: DeepSeek output-token price per million
        required: true
        type: string
      model:
        description: Candidate model identifier
        required: true
        default: deepseek-chat
        type: string

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_MODEL: ${{ inputs.model }}
      AI_EVAL_INPUT_COST_PER_MILLION: ${{ inputs.input_cost_per_million }}
      AI_EVAL_OUTPUT_COST_PER_MILLION: ${{ inputs.output_cost_per_million }}
      RAG_ENABLED: "false"
      EMBEDDING_WARM_ON_START: "false"
      LLMQUANT_ENABLED: "false"
      ENABLE_SCHEDULER: "false"
      ENABLE_REALTIME_FETCH: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Require candidate credentials and pricing
        run: |
          test -n "$DEEPSEEK_API_KEY"
          python - <<'PY'
          import os

          for name in (
              "AI_EVAL_INPUT_COST_PER_MILLION",
              "AI_EVAL_OUTPUT_COST_PER_MILLION",
          ):
              if float(os.environ[name]) <= 0:
                  raise SystemExit(f"{name} must be positive")
          PY
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run frozen candidate evaluation
        run: |
          mkdir -p artifacts
          python scripts/ai_eval.py \
            --json-output artifacts/ai_eval_candidate.json \
            --junit-output artifacts/ai_eval_candidate.xml \
            --baseline tests/reports/ai_eval_baseline_20260902.json
      - name: Recompute and validate candidate artifacts
        run: |
          python scripts/ai_eval.py --offline \
            --baseline artifacts/ai_eval_candidate.json \
            --junit-baseline artifacts/ai_eval_candidate.xml \
            --require-passing-baseline
          python scripts/analyze_ai_eval.py \
            artifacts/ai_eval_candidate.json \
            --json-output artifacts/ai_eval_candidate.analysis.json
      - name: Upload candidate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-candidate-${{ github.sha }}-${{ github.run_id }}
          path: backend/artifacts/
          if-no-files-found: warn
          retention-days: 30
